name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Production Release Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Source Verification & Test Suite
        run: |
          go mod verify
          go vet ./...
          go test -mod=mod ./...

      - name: Mandatory Race Verification
        run: make test-race

      - name: Interop Verification
        run: make test-interop

      - name: GoReleaser Multi-Platform Build & Attestation
        uses: goreleaser/goreleaser-action@90a345d6c32e41c462b2e0c3968435725e275405 # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Post-Release Artifact Smoke Test
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build and Smoke Test Binary Artifact
        run: |
          make build
          ./dist/skcr version
          TMP_DIR=$(mktemp -d)
          ./dist/skcr scaffold --target "$TMP_DIR" --name "smoke-skill"
          ./dist/skcr compile --source "$TMP_DIR/smoke-skill" --target skil

