name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  go:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - name: Format Check
        run: |
          git ls-files '*.go' | grep -v '^vendor/' | xargs gofmt -l | tee /tmp/gofmt
          test ! -s /tmp/gofmt
      - name: Vet
        run: go vet -mod=mod ./...
      - name: Test
        run: go test -mod=mod -timeout 8m ./...
      - name: Build Binary
        run: go build -mod=mod -trimpath -o bin/skcr ./cmd/skcr

  go-race:
    name: Mandatory Race Detector Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race Critical Packages Test
        run: make test-race

  schemas:
    name: Schema Validation Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -mod=mod ./internal/skillmeta/... ./internal/compiler/... -count=1
      - run: go test -mod=mod ./internal/scaffold/... -count=1

  determinism:
    name: Deterministic Compilation Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Verify Determinism
        run: go test -mod=mod ./internal/compiler/... -run TestCompileSkillDeterministicOutput -v

  govulncheck:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        uses: golang/govulncheck-action@b37419f930e3d367397641d402287114674ff07c # v1
        with:
          go-version-file: go.mod
