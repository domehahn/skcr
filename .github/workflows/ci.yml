name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - name: Format
        run: |
          git ls-files '*.go' | grep -v '^vendor/' | xargs gofmt -l | tee /tmp/gofmt
          test ! -s /tmp/gofmt
      - run: go vet -mod=mod ./...
      - run: go test -mod=mod -timeout 8m ./...
      - run: go build -mod=mod -trimpath -o bin/skcr ./cmd/skcr

  # Race-detector run, kept separate from the required "go" job above and
  # not (yet) a required branch-protection status check: internal/cli's
  # CLI-invocation-style tests (bake, validate, ...) run real file I/O
  # against many generated fixtures, and under -race the full suite takes
  # 30+ minutes — verified locally it completed in ~4m without -race but
  # was still running past 1800s under -race across three separate
  # confirmation attempts. That's genuinely slow, not hung (each attempt
  # made forward progress into new tests near its timeout), but blocking
  # every PR on a 30+ minute race run isn't a reasonable required gate
  # today. Keeping this job non-blocking preserves the signal without
  # making it a merge bottleneck; the real fix is profiling/splitting
  # internal/cli's test suite, which is out of scope for this pass.
  go-race:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -mod=mod -race -timeout 45m ./...

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -mod=mod ./internal/skillmeta/... ./internal/compiler/... -count=1
      - run: go test -mod=mod ./internal/scaffold/... -count=1

  skil-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -mod=mod -o bin/skcr ./cmd/skcr
      - name: Install pinned skil
        # Pinned to a specific commit, not a tag: skil has no tagged
        # releases yet (see its own docs/toolchain.md). The previous pin
        # (24a5ad6d) predated a skil-side schema-resolution fix and made
        # this job fail unconditionally on every single fixture — verified
        # locally that this commit's skil validates the existing
        # complete-skill fixture cleanly. Bump deliberately when skil
        # changes something this job should exercise; don't let it drift
        # silently.
        run: go install github.com/domehahn/skil/cmd/skil@0af857dc58b35d5fe15fcf6bf1c967a2a7a07193
      - name: Compile and validate every interop fixture
        run: |
          set -euo pipefail
          for fixture in tests/interop/*/; do
            fixture="${fixture%/}"
            name=$(basename "$fixture")
            echo "::group::$name"
            out="/tmp/compiled/$name"
            ./bin/skcr compile "$fixture" --target skil --output "$out" --require-lossless
            skil validate "$out/$name"
            skil scan "$out/$name" --static-only
            skil verify "$out/$name"
            echo "::endgroup::"
          done
