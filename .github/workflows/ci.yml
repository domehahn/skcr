name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - name: Format
        run: |
          git ls-files '*.go' | xargs gofmt -l | tee /tmp/gofmt
          test ! -s /tmp/gofmt
      - run: go vet -mod=mod ./...
      - run: go test -mod=mod -race -coverprofile=coverage.out ./...
      - run: go build -mod=mod -trimpath -o bin/skcr ./cmd/skcr

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -mod=mod ./internal/skillmeta/... ./internal/compiler/... -count=1
      - run: go test -mod=mod ./internal/scaffold/... -count=1

  skil-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -mod=mod -o bin/skcr ./cmd/skcr
      - name: Install pinned skil
        run: go install github.com/domehahn/skil/cmd/skil@24a5ad6d6089a0c3b3b045e3d106abc9e7142a68
      - name: Compile and validate every interop fixture
        run: |
          set -euo pipefail
          for fixture in tests/interop/*/; do
            fixture="${fixture%/}"
            name=$(basename "$fixture")
            echo "::group::$name"
            out="/tmp/compiled/$name"
            ./bin/skcr compile "$fixture" --target skil --output "$out" --require-lossless
            skil validate "$out/$name"
            skil scan "$out/$name" --static-only
            skil verify "$out/$name"
            echo "::endgroup::"
          done
