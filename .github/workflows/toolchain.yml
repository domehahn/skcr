name: Toolchain compatibility
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '31 4 * * *'
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  skil-interop:
    name: skil-interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - consumer: skcr
            provider: skil
            consumer_ref: main
            provider_ref: main
          - consumer: skcr
            provider: skil
            consumer_ref: main
            provider_ref: v0.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: domehahn/${{ matrix.consumer }}
          ref: ${{ matrix.consumer == 'skcr' && github.sha || matrix.consumer_ref }}
          path: ${{ matrix.consumer }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: domehahn/${{ matrix.provider }}
          ref: ${{ matrix.provider == 'skcr' && github.sha || matrix.provider_ref }}
          path: ${{ matrix.provider }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Record exact revisions
        run: |
          git -C "${{ matrix.consumer }}" rev-parse HEAD > consumer-revision.txt
          git -C "${{ matrix.provider }}" rev-parse HEAD > provider-revision.txt
      - name: Build and exercise real producer and consumer
        env:
          CONSUMER: ${{ matrix.consumer }}
          PROVIDER: ${{ matrix.provider }}
          SKIL_BINARY: ${{ github.workspace }}/bin/skil
          SKILLFORGE_REPO: ${{ github.workspace }}/SkillForge
        run: |
          set -euo pipefail
          mkdir -p bin
          if [ "$PROVIDER" = skil ]; then
            (cd skil && go build -trimpath -o "$SKIL_BINARY" ./cmd/skil)
            if [ "$CONSUMER" = skcr ]; then
              (cd skcr && go build -trimpath -o ../bin/skcr ./cmd/skcr)
              for fixture in skcr/tests/interop/*/; do
                name=$(basename "$fixture")
                bin/skcr compile "$fixture" --target skil --output "$RUNNER_TEMP/compiled" --require-lossless
                "$SKIL_BINARY" validate "$RUNNER_TEMP/compiled/$name"
                "$SKIL_BINARY" scan "$RUNNER_TEMP/compiled/$name" --static-only
                "$SKIL_BINARY" verify "$RUNNER_TEMP/compiled/$name"
              done
            else
              (cd skpm && go test -count=1 -timeout 2m -tags e2e ./internal/attestation/... -run TestVerifyInteropsWithRealSkilBinary -v)
            fi
          else
            # Build first: even older consumer tests cannot turn build failure into a skip.
            (cd SkillForge/skill-registry && go build ./cmd/skill-registry)
            (cd skpm && go test -count=1 -timeout 3m -tags e2e ./tests/integration/... -run TestSkillForgeE2E -v)
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: revisions-${{ matrix.consumer }}-${{ matrix.provider }}-${{ matrix.consumer_ref }}-${{ matrix.provider_ref }}
          path: '*-revision.txt'
          if-no-files-found: error
